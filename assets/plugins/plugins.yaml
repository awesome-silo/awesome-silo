  auth_provider.v1: auth
  scan_source.v1: library
  request_router.v1: integration
  watch_sync_provider.v1: integration
  marker_provider.v1: playback
  event_consumer.v1: playback

plugins:
  - name: "Tracearr Bridge"
    description: "Provides Tracearr monitoring, library synchronization, artwork, and stream termination for Silo."
    category: integration
    tier: other
    url: https://github.com/neilsb/silo-tracearr-bridge
    oss: https://github.com/neilsb/silo-tracearr-bridge
  - name: "Discord"
    description: "Integrates Silo with Discord."
    category: integration
    tier: other
    url: https://github.com/thezak48/silo-plugin-discord
    oss: https://github.com/thezak48/silo-plugin-discord
  - name: "Scrob Watch Provider (Foux)"
    description: "Synchronizes watch history, progress, ratings, and live playback with a self-hosted Scrob server."
    category: integration
    tier: other
    url: https://github.com/foux/silo-plugin-watchprovider-scrob
    oss: https://github.com/foux/silo-plugin-watchprovider-scrob

name: Generate plugin list

on:
  pull_request:
    paths:
      - "PLUGINS.md"
      - "assets/plugins/**"
      - "cmd/generate-plugins/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/generate-plugins.yaml"
  push:
    branches: [main]
    paths:
      - "assets/plugins/**"
      - "cmd/generate-plugins/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/generate-plugins.yaml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: generate-plugins-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PLUGIN_BLACKLISTED_OWNERS: ${{ secrets.PLUGIN_BLACKLISTED_OWNERS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate plugin list
        run: go run ./cmd/generate-plugins -out /tmp/PLUGINS.md

      - name: Verify generated file is up to date
        run: |
          if diff -u PLUGINS.md /tmp/PLUGINS.md > /tmp/PLUGINS.diff; then
            echo "PLUGINS.md matches the generated output." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Generated plugin list is out of date"
              echo
              echo "Run \`go run ./cmd/generate-plugins\` locally and commit the updated \`PLUGINS.md\`."
              echo
              echo '```diff'
              head -n 300 /tmp/PLUGINS.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: generated-plugins-md
          path: /tmp/PLUGINS.md
          if-no-files-found: warn

  regenerate:
    if: github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      PLUGIN_BLACKLISTED_OWNERS: ${{ secrets.PLUGIN_BLACKLISTED_OWNERS }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify repository blacklist secret is configured
        run: |
          if [ -z "$PLUGIN_BLACKLISTED_OWNERS" ]; then
            echo "::error::Configure the PLUGIN_BLACKLISTED_OWNERS repository Actions secret."
            exit 1
          fi

      - name: Refresh plugin manifest snapshots
        if: github.event_name != 'push'
        run: go run ./cmd/generate-plugins -update-manifests

      - name: Regenerate plugin list
        run: go run ./cmd/generate-plugins

      - name: Open generated plugin list PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            PLUGINS.md
            assets/plugins/manifests
          branch: automation/regenerate-plugins
          delete-branch: true
          commit-message: |
            docs: regenerate plugin list

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: "docs: regenerate plugin list"
          body: "Regenerate PLUGINS.md from the plugin YAML sources, manifest snapshots and template."

name: Add client submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: add-client-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-client:
    if: contains(github.event.issue.labels.*.name, 'request') && startsWith(github.event.issue.title, 'Client submission:') && (github.event.action != 'labeled' || github.event.label.name == 'request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Add client from issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: go run ./cmd/add-client

      - name: Generate and verify client list
        run: |
          go run ./cmd/generate-clients
          go run ./cmd/generate-clients -check

      - name: Open pull request
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            CLIENTS.md
            assets/clients/clients.yaml
          base: ${{ github.event.repository.default_branch }}
          branch: automation/client-submission-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: |
            feat(clients): add client from issue #${{ github.event.issue.number }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: "feat(clients): add client from submission #${{ github.event.issue.number }}"
          body: |
            Add the client submitted in #${{ github.event.issue.number }}.

            This entry is based on the submitter's answers. Please review the client details and project suitability before merging.

      - name: Notify submitter
        if: steps.pull-request.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh issue comment "$ISSUE_NUMBER" --body "Thanks! I opened $PULL_REQUEST_URL for review."

      - name: Report automation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The automated submission could not create a pull request. Check the workflow run for details: $RUN_URL"

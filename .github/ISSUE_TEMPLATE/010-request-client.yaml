name: "Suggest a client"
description: Submit a client for the catalog and an automated pull request.
title: "Client submission: "
labels:
  - request
body:
  - type: markdown
    attributes:
      value: |
        Submit the client details below to generate a pull request for review. Please check the [contribution guidelines](https://github.com/awesome-silo/awesome-silo/blob/main/CONTRIBUTING.md) and existing client list first. Automation does not merge pull requests.
  - type: input
    id: name
    attributes:
      label: Client name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Client website
      description: Homepage or repository URL.
      placeholder: https://example.com/client
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Open-source repository URL
      description: Leave blank if the client is not open source.
      placeholder: https://github.com/owner/client
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - Native
        - Compatible
      description: Native uses the Silo API; Compatible uses Jellyfin emulation.
    validations:
      required: true
  - type: checkboxes
    id: targets
    attributes:
      label: Targets
      description: Select at least one supported platform.
      options:
        - label: Browser
        - label: Windows
        - label: macOS
        - label: Linux
        - label: iOS
        - label: Android
        - label: SailfishOS
        - label: HarmonyOS
        - label: NintendoSwitch
        - label: Xbox
        - label: PlayStation
        - label: AppleTV
        - label: tvOS
        - label: AndroidTV
        - label: Kodi
        - label: Roku
        - label: Tizen
        - label: Vega
        - label: WebOS
  - type: dropdown
    id: price
    attributes:
      label: Price
      description: Include paid in-app purchases or subscriptions.
      options:
        - Free
        - Paid
        - Free and paid
    validations:
      required: true
  - type: textarea
    id: downloads
    attributes:
      label: Download links
      description: One link per line in the format "Name | URL".
      placeholder: |
        GitHub | https://github.com/owner/client/releases
        App Store | https://apps.apple.com/app/id123456
    validations:
      required: true
